<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RADAR Deals</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px 14px 60px;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: #ff3030;
    }

    .subtitle {
      color: #777;
      font-size: 12px;
      margin-top: 2px;
    }

    .live {
      color: #5cff85;
      font-size: 11px;
      font-weight: 900;
    }

    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #5cff85;
      border-radius: 50%;
      margin-right: 4px;
      box-shadow: 0 0 10px #5cff85;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat {
      background: #111;
      border: 1px solid #242424;
      border-radius: 15px;
      padding: 14px 10px;
    }

    .number {
      font-size: 24px;
      font-weight: 900;
    }

    .label {
      color: #777;
      font-size: 9px;
      text-transform: uppercase;
      margin-top: 3px;
      letter-spacing: .5px;
    }

    /* FILTERS */

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 5px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;
      border: 1px solid #292929;
      background: #111;
      color: #888;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 9px;
      font-weight: 900;
      cursor: pointer;
    }

    .filter.active {
      background: white;
      color: black;
      border-color: white;
    }

    /* SECTION */

    .section {
      font-size: 15px;
      font-weight: 900;
      margin: 8px 0 10px;
    }

    /* DEAL CARD */

    .deal {
      display: flex;
      gap: 12px;
      background: #101010;
      border: 1px solid #242424;
      border-radius: 18px;
      padding: 11px;
      margin-bottom: 10px;
    }

    .image {
      width: 105px;
      min-width: 105px;
      height: 105px;
      background: #181818;
      border-radius: 13px;
      object-fit: contain;
    }

    .no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    .badge {
      display: inline-block;
      padding: 4px 7px;
      border-radius: 7px;
      background: #351010;
      color: #ff5b5b;
      font-size: 9px;
      font-weight: 900;
    }

    .new-badge {
      display: inline-block;
      padding: 4px 7px;
      border-radius: 7px;
      background: #0d3320;
      color: #5cff85;
      font-size: 9px;
      font-weight: 900;
    }

    .retailer {
      color: #999;
      font-size: 10px;
      font-weight: 700;
      margin-top: 7px;
    }

    .name {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
      margin-top: 3px;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .prices {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .price {
      color: #5cff85;
      font-size: 21px;
      font-weight: 900;
    }

    .old {
      color: #666;
      text-decoration: line-through;
      font-size: 11px;
    }

    .discount {
      color: #ff5b5b;
      font-size: 10px;
      font-weight: 900;
    }

    .store {
      color: #888;
      font-size: 10px;
      margin-top: 7px;
    }

    .button {
      display: inline-block;
      background: white;
      color: black;
      text-decoration: none;
      font-size: 9px;
      font-weight: 900;
      padding: 7px 10px;
      border-radius: 8px;
      margin-top: 8px;
    }

    /* EMPTY / LOADING */

    .empty {
      text-align: center;
      color: #666;
      padding: 55px 10px;
      font-size: 13px;
    }

    /* DESKTOP */

    @media (min-width: 700px) {

      .container {
        padding-top: 35px;
      }

      .logo {
        font-size: 38px;
      }

      .image {
        width: 135px;
        min-width: 135px;
        height: 135px;
      }

      .name {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <header>

    <div>

      <div class="logo">
        🚨 <span>RADAR</span>
      </div>

      <div class="subtitle">
        Walmart + Home Depot deal scanner
      </div>

    </div>

    <div class="live">
      <span class="live-dot"></span>
      LIVE
    </div>

  </header>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <div
        class="number"
        id="total">
        —
      </div>

      <div class="label">
        Deals Found
      </div>

    </div>


    <div class="stat">

      <div
        class="number"
        id="penny">
        —
      </div>

      <div class="label">
        ≤ $1
      </div>

    </div>


    <div class="stat">

      <div
        class="number"
        id="discount">
        —
      </div>

      <div class="label">
        90%+ Off
      </div>

    </div>

  </div>


  <!-- FILTERS -->

  <div class="filters">

    <button
      class="filter active"
      onclick="setFilter('all', this)">
      ALL
    </button>

    <button
      class="filter"
      onclick="setFilter('walmart', this)">
      WALMART
    </button>

    <button
      class="filter"
      onclick="setFilter('home depot', this)">
      HOME DEPOT
    </button>

    <button
      class="filter"
      onclick="setFilter('penny', this)">
      ≤ $1
    </button>

    <button
      class="filter"
      onclick="setFilter('discount', this)">
      90%+ OFF
    </button>

  </div>


  <div class="section">
    Latest Radar Hits
  </div>


  <!-- DEALS -->

  <div id="deals">

    <div class="empty">
      📡 Loading radar...
    </div>

  </div>

</div>


<script>

const API_URL =
  "https://nmytuljkkssuurqxnjxi.supabase.co/functions/v1/radar-api";


let allDeals = [];

let currentFilter = "all";


/* LOAD DATA */

async function loadDeals() {

  try {

    const response =
      await fetch(API_URL);

    if (!response.ok) {
      throw new Error("Radar API error");
    }

    allDeals =
      await response.json();


    /*
      SORTING

      1. $1 or less
      2. Highest discounts
      3. Newest
    */

    allDeals.sort((a, b) => {

      const aPrice =
        Number(a.deal_price);

      const bPrice =
        Number(b.deal_price);

      const aPenny =
        aPrice <= 1;

      const bPenny =
        bPrice <= 1;


      if (aPenny && !bPenny) {
        return -1;
      }

      if (!aPenny && bPenny) {
        return 1;
      }


      const aDiscount =
        Number(a.discount_percent || 0);

      const bDiscount =
        Number(b.discount_percent || 0);


      if (bDiscount !== aDiscount) {
        return bDiscount - aDiscount;
      }


      return (
        new Date(b.created_at) -
        new Date(a.created_at)
      );

    });


    updateStats();

    renderDeals();

  }

  catch (error) {

    console.error(error);

    document.getElementById("deals").innerHTML = `
      <div class="empty">
        ⚠️ Radar connection error.
      </div>
    `;

  }

}


/* STATS */

function updateStats() {

  document.getElementById("total").textContent =
    allDeals.length;


  document.getElementById("penny").textContent =
    allDeals.filter(
      d => Number(d.deal_price) <= 1
    ).length;


  document.getElementById("discount").textContent =
    allDeals.filter(
      d =>
        Number(d.discount_percent || 0) >= 90
    ).length;

}


/* FILTER */

function setFilter(filter, button) {

  currentFilter = filter;


  document
    .querySelectorAll(".filter")
    .forEach(btn => {
      btn.classList.remove("active");
    });


  button.classList.add("active");


  renderDeals();

}


/* FILTERED DEALS */

function getFilteredDeals() {

  let deals =
    [...allDeals];


  if (currentFilter === "walmart") {

    deals =
      deals.filter(d =>
        (d.retailer || "")
          .toLowerCase()
          .includes("walmart")
      );

  }


  if (currentFilter === "home depot") {

    deals =
      deals.filter(d =>
        (d.retailer || "")
          .toLowerCase()
          .includes("home depot")
      );

  }


  if (currentFilter === "penny") {

    deals =
      deals.filter(d =>
        Number(d.deal_price) <= 1
      );

  }


  if (currentFilter === "discount") {

    deals =
      deals.filter(d =>
        Number(d.discount_percent || 0) >= 90
      );

  }


  return deals;

}


/* RENDER DEALS */

function renderDeals() {

  const container =
    document.getElementById("deals");


  const deals =
    getFilteredDeals();


  if (!deals.length) {

    container.innerHTML = `
      <div class="empty">
        📡 No deals found for this filter.
      </div>
    `;

    return;

  }


  container.innerHTML =
    deals.map(deal => {


      const price =
        deal.deal_price !== null &&
        deal.deal_price !== undefined
          ? "$" +
            Number(
              deal.deal_price
            ).toFixed(2)
          : "N/A";


      const original =
        deal.normal_price !== null &&
        deal.normal_price !== undefined
          ? "$" +
            Number(
              deal.normal_price
            ).toFixed(2)
          : "";


      const discount =
        deal.discount_percent !== null &&
        deal.discount_percent !== undefined
          ? Math.round(
              Number(
                deal.discount_percent
              )
            ) + "% OFF"
          : "";


      const isPenny =
        Number(deal.deal_price) <= 1;


      const badge =
        isPenny
          ? "🔥 PENNY DEAL"
          : "💥 90%+ OFF";


      const created =
        new Date(
          deal.created_at
        );


      const isNew =
        Date.now() -
        created.getTime()
        < 6 * 60 * 60 * 1000;


      return `

        <div class="deal">


          ${
            deal.image_url

              ? `

                <img
                  class="image"
                  src="${escapeHtml(
                    deal.image_url
                  )}"
                  alt=""
                >

              `

              : `

                <div class="image no-image">
                  📦
                </div>

              `
          }


          <div class="info">


            <div class="top-line">


              <span class="badge">
                ${badge}
              </span>


              ${
                isNew

                  ? `

                    <span class="new-badge">
                      NEW
                    </span>

                  `

                  : ""
              }


            </div>


            <div class="retailer">

              ${escapeHtml(
                deal.retailer || ""
              )}

            </div>


            <div class="name">

              ${escapeHtml(
                deal.name ||
                "Unknown Product"
              )}

            </div>


            <div class="prices">


              <span class="price">

                ${price}

              </span>


              ${
                original

                  ? `

                    <span class="old">
                      ${original}
                    </span>

                  `

                  : ""
              }


              ${
                discount

                  ? `

                    <span class="discount">
                      ${discount}
                    </span>

                  `

                  : ""
              }


            </div>


            <div class="store">

              📍

              ${
                deal.store_name
                  ? escapeHtml(
                      deal.store_name
                    )
                  : "Store unavailable"
              }

              ${
                deal.store_zip
                  ? " • " +
                    escapeHtml(
                      deal.store_zip
                    )
                  : ""
              }

            </div>


            ${
              deal.product_url

                ? `

                  <a
                    class="button"
                    href="${escapeHtml(
                      deal.product_url
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >

                    VIEW DEAL →

                  </a>

                `

                : ""
            }


          </div>

        </div>

      `;

    }).join("");

}


/* HTML SAFETY */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* START */

loadDeals();


/*
  Refresh every 60 seconds
*/

setInterval(
  loadDeals,
  60000
);

</script>

</body>
</html>
